[theme]
base = "dark"
primaryColor = "#6C63FF"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#13161d"
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
